name: CI/CD Frontend

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login a GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push imagen
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
          build-args: |
            NEXT_GROQ_API_KEY=${{ secrets.NEXT_GROQ_API_KEY }}
            NEXT_GROQ_MODEL=${{ secrets.NEXT_GROQ_MODEL }}

      - name: Deploy en Droplet
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          port: ${{ secrets.DO_PORT }}
          envs: NEXT_GROQ_API_KEY,NEXT_GROQ_MODEL
          script: |
            docker login ghcr.io -u ${{ github.actor }} --password ${{ secrets.GITHUB_TOKEN }}
            docker pull ghcr.io/${{ github.repository }}:latest

            mkdir -p /etc/admins-front
            printf '%s\n' \
              "NEXT_GROQ_API_KEY=${NEXT_GROQ_API_KEY}" \
              "NEXT_GROQ_MODEL=${NEXT_GROQ_MODEL}" \
              > /etc/admins-front/.env
            chmod 600 /etc/admins-front/.env

            docker stop admins-front || true
            docker rm   admins-front || true

            docker run -d \
              --name admins-front \
              --restart always \
              --network red_interna \
              --env-file /etc/admins-front/.env \
              -p 3011:3000 \
              ghcr.io/${{ github.repository }}:latest